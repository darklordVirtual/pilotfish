[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotfish"
version = "0.1.0"
description = "Governed access-link selection and traffic routing"
requires-python = ">=3.12"
dependencies = ["cbor2>=5.6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pilotfish = "pilotfish.cli:main"

[tool.setuptools.packages.find]
include = ["pilotfish*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
